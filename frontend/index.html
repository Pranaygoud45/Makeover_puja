<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta
      name="description"
      content="Pooja Makeover is a luxury beauty parlour and bridal makeover studio in Mumbai offering bridal makeup, hair styling, skin care, facials, and curated beauty packages."

    <meta
      name="keywords"
      content="Pooja Makeover, bridal makeup Mumbai, beauty parlour, hair styling, skin care, party makeup, pre-bridal packages"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pooja Makeover" />

      property="og:description"

      content="https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=1200&q=80"
    />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pooja Makeover | Your Beauty, Our Art." />
    <meta
      name="twitter:description"
      content="Bespoke bridal makeup, hair styling, skin care, and professional makeover services in Mumbai."
    />

    <title>Pooja Makeover | Your Beauty, Our Art.</title>

    <!-- LocalBusiness / BeautySalon Structured Data -->
    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Pooja Makeover",
        "description": "Luxury beauty parlour and bridal makeover studio offering bespoke bridal makeup, hair styling, skin care, facials, and pre-bridal packages.",

        "telephone": "+91 98765 43210",
        "email": "hello@poojamakeover.com",
        "image": "https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=1200&q=80",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "123, Beauty Lane, MG Road",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "postalCode": "400001",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "10:00",
            "closes": "20:00"

          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "21:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",

            "closes": "18:00"
          }

        "sameAs": [
          "https://instagram.com/poojamakeover",

        ]
      }

  <body>
    <div id="root"></div>
