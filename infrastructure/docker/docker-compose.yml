services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beauty_db
      POSTGRES_USER: beauty_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty_user -d beauty_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
